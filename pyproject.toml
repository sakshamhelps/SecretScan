[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secretscan"
version = "0.1.0"
description = "Detect potentially exposed secrets in source code using transparent rules."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "BYREX"}]
dependencies = []

[project.scripts]
secretscan = "secretscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
